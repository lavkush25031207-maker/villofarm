spring:
  datasource:
    url: "jdbc:${DATABASE_URL:postgresql://postgres:postgres@${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:villofarm}}"
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
app:
  jwt-secret: ${JWT_SECRET:replace-with-a-long-development-secret}
  jwt-expiration-ms: 86400000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
