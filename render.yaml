services:
  - type: web
    name: villofarm-api-sg
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: healthy-dishes-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: healthy-dishes-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: healthy-dishes-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: healthy-dishes-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: healthy-dishes-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
